name: Build & Test

# ATENCAO — este workflow NAO publica release, e isso e deliberado.
#
# Ate a v5.0.0 ele criava o release sozinho quando o VERSION mudava na main:
# apagava o release existente (`gh release delete`) e subia um build proprio, so
# com o .exe. Isso quebrou a v5.0.0 na pratica — o release assinado publicado da
# maquina do autor foi destruido 48s depois do merge, e o app de todo cliente
# passou a recusar a atualizacao com "a atualizacao nao veio assinada".
#
# Desde a v5.0.0 o app so instala atualizacao ASSINADA (Ed25519, chave publica
# embutida no binario — ver docs/DISTRIBUICAO-CONFIANCA.md). Publicar daqui
# exigiria a chave privada nos Secrets do GitHub, e isso derrubaria a unica
# garantia que a assinatura oferece: se o repositorio for comprometido, o
# atacante NAO consegue assinar. Chave dentro do CI = atacante assina.
#
# Publicar e feito na maquina de quem tem a chave:
#
#     cd app; .\publicar.ps1 5.0.1 -Notas "o que mudou"
#
# O que sobra aqui e o que o CI faz bem: garantir que a main compila e passa nos
# testes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: app/go.sum

      - name: Gerar recurso (icone + manifesto + versao)
        working-directory: app
        shell: pwsh
        run: python resgen.py

      - name: go vet
        working-directory: app
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go vet ./...

      - name: Testes
        working-directory: app
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go test ./... -count=1

      - name: Build
        working-directory: app
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-H windowsgui -s -w" -o ThazzDraco.exe .
          $tam = (Get-Item ThazzDraco.exe).Length
          Write-Host "Build OK: $tam bytes"

      # A ferramenta de publicacao tambem precisa continuar compilando, senao o
      # release quebra so na hora de publicar.
      - name: Build da ferramenta de assinatura
        working-directory: app
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -o assinar.exe ./cmd/assinar
